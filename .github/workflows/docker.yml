name: docker

on:
  workflow_call:
    secrets:
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true
      # registry/namespace 属部署侧私有值（与 compose 的 NTU_SHOWER_IMAGE 同一
      # 归属）：由调用方经 secrets 块传入，不落在任何公开文件里。workflow_call
      # 的 with: 不支持 secrets 上下文（官方 contexts availability 表），故不作为
      # input。fork PR 拿不到 secrets 时取值为空：ACR 镜像行回退合法 local 名
      # （metadata-action 忽略空行，PR 上 build 本就 push: false）。
      ACR_REGISTRY:
        required: false
      ACR_NAMESPACE:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        if: github.event_name != 'pull_request' && secrets.ACR_REGISTRY != ''
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.ACR_REGISTRY != '' && format('{0}/{1}/{2}', secrets.ACR_REGISTRY, secrets.ACR_NAMESPACE, github.event.repository.name) || format('local/{0}', github.event.repository.name) }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      # provenance: false（ACR 个人版拒绝 provenance 产生的 OCI empty manifest）
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
