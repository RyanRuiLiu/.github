name: docker

on:
  workflow_call:
    inputs:
      # All inputs are optional. Defaults: repository name, repository root,
      # and branch/semver/sha tags.
      image_name:
        required: false
        type: string
        default: ''
      context:
        required: false
        type: string
        default: '.'
      dockerfile:
        required: false
        type: string
        default: './Dockerfile'
      tags:
        required: false
        type: string
        default: ''
      # Cache export mode for type=gha (max or min).
      cache_mode:
        required: false
        type: string
        default: 'max'
    secrets:
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true
      # Registry and namespace are private. Keep them optional so pull request
      # builds can run without registry credentials.
      ACR_REGISTRY:
        required: false
      ACR_NAMESPACE:
        required: false

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: img
        # Default to the repository name and branch/semver/sha tags.
        env:
          TAGS_INPUT: ${{ inputs.tags }}
        run: |
          base=${{ inputs.image_name != '' && inputs.image_name || github.event.repository.name }}
          if [ -n "$TAGS_INPUT" ]; then
            tags=$TAGS_INPUT
          else
            tags='type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha'
          fi
          {
            echo "base=$base"
            echo "tags<<__TAGS__"
            printf '%s\n' "$tags"
            echo "__TAGS__"
          } >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ${{ secrets.ACR_REGISTRY != '' && format('{0}/{1}/{2}', secrets.ACR_REGISTRY, secrets.ACR_NAMESPACE, steps.img.outputs.base) || format('local/{0}', steps.img.outputs.base) }}
          tags: ${{ steps.img.outputs.tags }}
      # ACR Personal Edition rejects provenance manifests.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=${{ inputs.cache_mode }}
