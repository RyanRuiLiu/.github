name: deploy

on:
  workflow_call:
    inputs:
      hook:
        description: Deployment hook name under /hooks/.
        required: true
        type: string
      status-hook:
        description: Optional status hook polled until the trigger SHA succeeds.
        required: false
        type: string
        default: ''
      timeout-seconds:
        description: Request timeout for the trigger call.
        required: false
        type: number
        default: 300
      verify-url:
        description: Optional URL polled until it returns HTTP 200.
        required: false
        type: string
        default: ''
    secrets:
      WEBHOOK_SECRET:
        required: true

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger deployment
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          HOOK: ${{ inputs.hook }}
          TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        run: |
          body="{\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}"
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')
          curl -fsS --max-time "$TIMEOUT_SECONDS" --retry 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$signature" \
            --data-binary "$body" \
            "https://ryanliu.cn/hooks/${HOOK}"

      - name: Wait for status
        if: inputs.status-hook != ''
        env:
          STATUS_HOOK: ${{ inputs.status-hook }}
        run: |
          for i in $(seq 1 60); do
            body=$(curl -s --max-time 5 "https://ryanliu.cn/hooks/${STATUS_HOOK}" || true)
            state=$(printf '%s' "$body" | jq -r '.state // empty' 2>/dev/null || true)
            sha=$(printf '%s' "$body" | jq -r '.sha // empty' 2>/dev/null || true)
            if [ "$sha" = "$GITHUB_SHA" ]; then
              if [ "$state" = "success" ]; then
                exit 0
              fi
              if [ "$state" = "failed" ]; then
                echo "status failed: $body" >&2
                exit 1
              fi
            fi
            sleep 5
          done
          echo "status timeout: $body" >&2
          exit 1

      - name: Verify site
        if: inputs.verify-url != ''
        env:
          VERIFY_URL: ${{ inputs.verify-url }}
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$VERIFY_URL" || true)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "site not healthy: $code" >&2
          exit 1
